name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin

          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true

          sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/33.0.0" >> $GITHUB_PATH
          echo "$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_PATH

      - name: Verify SDK Setup
        run: |
          echo "=== AIDL Check ==="
          ls $HOME/android-sdk/build-tools/33.0.0/aidl || echo "AIDL NOT FOUND"
          echo "=== NDK Check ==="
          ls $HOME/android-sdk/ndk/25.2.9519653 || echo "NDK NOT FOUND"
          echo "=== SDK Root ==="
          echo $ANDROID_SDK_ROOT
          echo "=== NDK Home ==="
          echo $ANDROID_NDK_HOME

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Show Project Files
        run: |
          echo "=== Project Files ==="
          ls -la
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo "=== main.py exists? ==="
          ls main.py || echo "main.py NOT FOUND"

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653
          export PATH=$PATH:$HOME/android-sdk/build-tools/33.0.0
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
          buildozer -v android debug 2>&1 | tee build.log
          echo "Exit code: $?"

      - name: Find APK
        if: always()
        run: |
          echo "=== Find APK ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"
          echo "=== bin folder ==="
          ls -la bin/ || echo "bin/ NOT found"
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log || echo "No build log"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: MITRA-AI-APK
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: build-log
          path: build.log
